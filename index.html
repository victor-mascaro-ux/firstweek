/* switching laptops: an overlay says whose screen it is now, and when */
function renderSwitch() {
  const layer = $('#switch');
  if (!state.switching) {
    if (!layer.classList.contains('on')) return;
    if (reduceMotion()) { layer.classList.remove('on', 'out'); layer.innerHTML = ''; return; }
    layer.classList.add('out');
    setTimeout(() => { if (!state.switching) { layer.classList.remove('on', 'out'); layer.innerHTML = ''; } }, 250);
    return;
  }
  const { role, when } = state.switching;
  layer.innerHTML = `<div class="switch-card"><span class="avatar big ${role}">${PEOPLE[role].ini}</span><p class="sw-name">${t(role === 'nina' ? 'switchNina' : 'switchOmar')}</p><p class="sw-when">${t(when)}</p></div>`;
  layer.classList.remove('out'); layer.classList.add('on');
}
function switchTo(role, when) {
  if (state.role === role && !state.switching) return;
  const run = state;
  state.switching = { role, when };
  state.menu = null; state.adding = null; state.modal = null;
  hideNotif();
  renderSwitch(); renderGuide();
  announce(`${t(role === 'nina' ? 'switchNina' : 'switchOmar')}, ${t(when)}`);
  setTimeout(() => {
    if (state !== run) return;
    state.role = role; state.srcView = null; state.doc = null; state.ninaTab = 'week'; state.omarTab = 'hires';
    renderApp(); renderGuide();
  }, reduceMotion() ? 150 : 750);
  setTimeout(() => {
    if (state !== run) return;
    state.switching = null; renderSwitch(); markActive();
    const h = $('#app h1'); if (h) h.focus({ preventScroll: true });
  }, reduceMotion() ? 500 : 1700);
}
// a person's reply, as the laptop's own notification; clicking it opens the chat
let notifTimer = null;
function showNotif(m) {
  const from = m.from || 'jordan', p = person(from), el = $('#notif');
  announce(t('mToast', { name: p.name }));
  el.innerHTML = `<p class="nt-top"><span class="mini-logo">${LOGO}</span><span>Firstweek</span><span class="nt-when">${t('notifNow')}</span><button class="nt-x" type="button" data-action="notif-close" aria-label="${t('notifClose')}">${icon('close')}</button></p>
    <button class="nt-body" type="button" data-action="notif-open">${avatarHTML(from)}<span class="nt-msg"><b>${esc(p.name)}</b><span class="nt-text">${replyText(m)}</span></span></button>`;
  el.removeAttribute('aria-hidden'); el.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(hideNotif, 6000);
}
function hideNotif() {
  const el = $('#notif');
  clearTimeout(notifTimer);
  el.classList.remove('show'); el.setAttribute('aria-hidden', 'true');
}
let toastTimer = null;
function showToast(msg) {
  announce(msg);
  const el = $('#toast');
  el.querySelector('span').textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* actions */
function openSource(id) {
  state.srcView = id; state.menu = null; state.checkedSource = true;
  state.focus = '#side-title';
  renderApp(); renderGuide();
}
function moveStep(id, day) {
  const i = state.steps.findIndex(s => s.id === id);
  if (i < 0) return;
  const s = state.steps[i];
  state.menu = null;
  if (s.day === day) { renderApp(); return; }
  // a moved step goes to the end of its new day
  state.steps.splice(i, 1); s.day = day; state.steps.push(s);
  if (id === 'vpn' && day === 1) state.moved = true;
  state.flash = id; state.focus = `[data-action="step-menu"][data-step="${id}"]`;
  renderApp(); renderGuide(); state.flash = null;
  showToast(t('movedToast', { n: day }));
}
function addSave() {
  const n = state.adding, text = state.addDraft.trim();
  if (!n) return;
  if (!text) { const inp = $('#add-input'); if (inp) { replay(inp, 'shake'); inp.focus(); } return; }
  const id = 'c' + (++state.customN);
  state.steps.push({ id, day: n, custom: true, title: text, idea: state.addIdea && t('idea_' + state.addIdea) === text ? state.addIdea : null });
  if (n === 2) state.added = true;
  state.adding = null; state.addDraft = ''; state.addIdea = null;
  state.flash = id; state.focus = `[data-action="add-step"][data-day="${n}"]`;
  renderApp(); renderGuide(); state.flash = null;
  showToast(t('addedToast', { n }));
}
function publish() {
  startClock();
  state.published = true; state.menu = null; state.adding = null; state.srcView = null;
  renderApp(); renderGuide();
  showToast(t('publishedToast'));
}
function matchQuestion(text) {
  const s = text.toLowerCase();
  if (/health|insurance|benefit|medical|saúde|plano|convênio|benefício/.test(s)) return 'q1';
  if (/vacation|days off|time off|pto|holiday|leave|férias|folga/.test(s)) return 'q2';
  if (/\bdogs?\b|\bpets?\b|puppy|cachorr|\bcão\b|\bcães\b|animal/.test(s)) return 'q3';
  return 'other';
}
function ask(q, text) {
  const run = state;
  startClock();
  if (q !== 'other') state.asked[q] = true;
  state.chat.push({ id: ++msgN, kind: 'me', text: text || t(q) });
  const think = { id: ++msgN, kind: 'think' };
  state.chat.push(think);
  state.askDraft = ''; state.doc = null;
  renderApp();
  setTimeout(() => {
    if (state !== run) return;
    const answer = { id: ++msgN, kind: 'ai', q, text: text || t(q), typed: !!text };
    const i = state.chat.indexOf(think);
    if (i >= 0) state.chat.splice(i, 1, answer); else state.chat.push(answer);
    if (q !== 'other') state.answered[q] = true;
    if (state.role === 'nina') renderApp();
    renderGuide();
    announce(t(q === 'q3' ? 'a3' : q === 'other' ? 'aUnknown' : 'sourcesH'));
  }, reduceMotion() ? 250 : 1100);
}
function openDoc(doc, sec, q) {
  state.doc = { doc, sec, fresh: true };
  if (q === 'q1' && doc === 'benefits') state.q1Src = true;
  state.focus = '#doc-title';
  renderApp(); renderGuide();
}
// a message starts from an answer the documents couldn't give (to Jordan), or from the People tab (to anyone)
function draftFor(modal) {
  const m = modal.msgId && state.chat.find(x => x.id === modal.msgId);
  if (modal.to === 'jordan' && m) return m.q === 'other' ? t('jMsgOther', { q: m.text }) : t('jMsg');
  return t('mDraft', { first: person(modal.to).first });
}
function openMessage(to, msgId) {
  state.modal = { to, msgId: msgId || null };
  state.mDraft = draftFor(state.modal); state.mEdited = false;
  state.focus = '#m-msg';
  renderApp();
  const ta = $('#m-msg'); if (ta) ta.setSelectionRange(ta.value.length, ta.value.length);
}
function closeModal() {
  const { to, msgId } = state.modal;
  state.modal = null;
  state.focus = msgId ? `[data-action="ask-jordan"][data-m="${msgId}"]` : `[data-action="message"][data-to="${to}"]`;
  renderApp();
}
function sendMessage() {
  const run = state, { to, msgId } = state.modal, m = msgId && state.chat.find(x => x.id === msgId);
  const dog = to === 'jordan' && !!m && m.q === 'q3';
  state.modal = null;
  if (dog) state.sentJordan = true; else if (m) m.sent = true;
  // an untouched draft is rebuilt on render, so it follows a language switch
  state.chat.push({ id: ++msgN, kind: 'sent', to, msgId, text: state.mEdited ? state.mDraft.trim() : null });
  // sent from People: My first week's chat is where the message and the answer show up
  const fromPeople = state.ninaTab === 'people';
  state.ninaTab = 'week'; state.focus = '#ask-input';
  renderApp(); renderGuide();
  // a narrow window stacks day 1 above the chat, so the chat comes up
  const body = $('.nina-body'), askEl = $('.ask');
  if (fromPeople && body && askEl) body.scrollTop = askEl.offsetTop;
  setTimeout(() => {
    if (state !== run) return;
    const reply = { id: ++msgN, kind: 'human', from: to, generic: !dog };
    state.chat.push(reply);
    if (state.role === 'nina') renderApp();
    // it reaches Nina's laptop: on Omar's, there is nothing to show
    if (state.role === 'nina' && !state.switching) showNotif(reply);
    if (!dog) return;
    // Jordan's answer reaches the People team as one to keep
    state.keep = 'pending';
    if (state.role === 'omar') renderApp();
  }, reduceMotion() ? 600 : 2200);
}
function keepAnswer() {
  state.keep = 'kept'; state.docAdded = true;
  state.finishMs = state.startedAt ? Date.now() - state.startedAt : null;
  state.focus = '#plan-title';
  renderApp(); renderGuide();
  showToast(t('keptToast'));
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  if (state.guideOpen && !e.target.closest('#guide')) closeGuide();
  // a click anywhere else closes a step's menu
  if (state.menu && !e.target.closest('.menu') && !e.target.closest('[data-action="step-menu"]')) { state.menu = null; renderApp(); }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.getAttribute('aria-disabled') === 'true') return;
  const a = el.dataset.action;
  const before = currentTask();
  switch (a) {
    case 'demo': demo(); break;
    case 'guide-toggle': {
      const refocus = () => { const b = document.querySelector('[data-action="guide-toggle"]'); if (b) b.focus(); };
      if (state.guideOpen) closeGuide(refocus);
      else { openGuide(); refocus(); }
      break;
    }
    case 'lang': {
      const inPanel = !!el.closest('#intro');
      state.lang = state.lang === 'en' ? 'pt' : 'en';
      // an idea picked for a new step, and an untouched message to Jordan, follow the language
      if (state.addIdea) state.addDraft = t('idea_' + state.addIdea);
      if (state.modal && !state.mEdited) state.mDraft = draftFor(state.modal);
      if (typing) typing.finish();
      renderIntro(); render();
      const b = document.querySelector(inPanel ? '#intro [data-action="lang"]' : '#guide [data-action="lang"]'); if (b) b.focus();
      if (!reduceMotion()) { document.querySelectorAll('.lang-btn').forEach(btn => replay(btn, 'is-flipping')); typeIn(); }
      break;
    }
    case 'theme': setTheme(currentTheme() === 'dark' ? 'light' : 'dark', el); break;
    case 'notif-close': hideNotif(); break;
    case 'notif-open': {
      hideNotif();
      if (state.role !== 'nina') break;
      state.ninaTab = 'week'; state.modal = null; state.focus = '#ask-input';
      renderApp();
      const chat = $('.chat'); if (chat) chat.scrollTop = chat.scrollHeight;
      const body = $('.nina-body'), askEl = $('.ask'); if (body && askEl) body.scrollTop = askEl.offsetTop;
      break;
    }
    case 'restart': {
      const go = () => { state = newState(state); seenMsgs.clear(); msgN = 0; shownChat = 0; $('#toast').classList.remove('show'); hideNotif(); render(); markActive(); };
      if (state.guideOpen) closeGuide(go); else go();
      break;
    }
    // Try it: the window glows and the steps panel opens with the current task
    case 'hint': lastActivity = performance.now() - HINT_DELAY; hintScrollAt = 0; replay($('#laptop .lid'), 'look'); openGuide(); break;
    case 'step-src': startClock(); openSource(el.dataset.step); break;
    case 'src-close': state.srcView = null; state.focus = `[data-action="step-src"]`; renderApp(); break;
    case 'step-menu': state.menu = state.menu === el.dataset.step ? null : el.dataset.step; state.adding = null; renderApp(); break;
    case 'move-to': startClock(); moveStep(el.dataset.step, Number(el.dataset.day)); break;
    case 'remove-step': {
      state.steps = state.steps.filter(s => s.id !== el.dataset.step);
      if (state.srcView === el.dataset.step) state.srcView = null;
      state.menu = null; renderApp(); showToast(t('removedToast'));
      break;
    }
    case 'add-step': startClock(); state.adding = Number(el.dataset.day); state.addDraft = ''; state.addIdea = null; state.menu = null; state.focus = '#add-input'; renderApp(); break;
    case 'idea': {
      state.addIdea = el.dataset.idea; state.addDraft = t('idea_' + state.addIdea);
      const inp = $('#add-input'); if (inp) { inp.value = state.addDraft; inp.focus(); }
      break;
    }
    case 'add-save': addSave(); break;
    case 'add-cancel': { const n = state.adding; state.adding = null; state.focus = `[data-action="add-step"][data-day="${n}"]`; renderApp(); break; }
    case 'publish': publish(); break;
    case 'ask-q': ask(el.dataset.q); break;
    case 'cite': openDoc(el.dataset.doc, el.dataset.sec, el.dataset.q); break;
    case 'doc-close': {
      state.doc = null; state.focus = '#ask-input'; renderApp();
      // in the one-column layout, go back to the answer
      const inp = $('#ask-input'); if (inp) inp.scrollIntoView({ block: 'nearest' });
      break;
    }
    case 'ask-jordan': openMessage('jordan', Number(el.dataset.m)); break;
    case 'message': openMessage(el.dataset.to, null); break;
    case 'nav':
      if (state.role === 'omar') {
        state.omarTab = el.dataset.tab; state.srcView = null; state.menu = null; state.adding = null;
        state.focus = { hires: '#plan-title', docs: '#lib-title', answers: '#ans-title' }[state.omarTab];
      } else { state.ninaTab = el.dataset.tab; state.doc = null; state.focus = state.ninaTab === 'people' ? '#people-title' : '#week-title'; }
      renderApp(); break;
    case 'lib-open': {
      state.libDoc = el.dataset.doc; state.omarTab = 'docs'; state.focus = '#lib-doc-title';
      renderApp();
      const r = $('.lib-read'); if (r) r.scrollTop = 0;
      // stacked in a narrow window: the document comes up to the top
      const lib = $('.lib'), read = $('.lib-read');
      if (lib && read && getComputedStyle(lib).display === 'block') lib.scrollTop = read.offsetTop;
      break;
    }
    case 'go-laptop': startClock(); switchTo(el.dataset.role, el.dataset.role === 'nina' ? 'whenMon' : 'whenLater'); break;
    case 'modal-close': if (el.classList.contains('modal-layer') && e.target !== el) break; closeModal(); break;
    case 'send-msg': sendMessage(); break;
    case 'keep-add': keepAnswer(); break;
    case 'keep-later': state.keep = 'later'; renderApp(); break;
    case 'keep-review': state.keep = 'pending'; state.focus = '[data-action="keep-add"]'; renderApp(); break;
  }
  if (!['demo', 'guide-toggle', 'lang'].includes(a) && currentTask() !== before) renderGuide();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.name === 'ask') state.askDraft = el.value;
  else if (el.name === 'add') { state.addDraft = el.value; if (state.addIdea && el.value !== t('idea_' + state.addIdea)) state.addIdea = null; }
  else if (el.name === 'mmsg') { state.mDraft = el.value; state.mEdited = true; }
});
document.addEventListener('change', e => {
  if (e.target.name !== 'todo') return;
  state.checked[e.target.dataset.step] = e.target.checked;
  renderApp();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'add-form') addSave();
  else if (e.target.id === 'ask-form') {
    const text = state.askDraft.trim();
    if (text) { state.focus = '#ask-input'; ask(matchQuestion(text), text); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.modal) { e.preventDefault(); closeModal(); }
    else if (state.menu) { const id = state.menu; state.menu = null; state.focus = `[data-action="step-menu"][data-step="${id}"]`; renderApp(); }
    else if (state.adding) { const n = state.adding; state.adding = null; state.focus = `[data-action="add-step"][data-day="${n}"]`; renderApp(); }
    else if (state.doc) { state.doc = null; state.focus = '#ask-input'; renderApp(); }
    else if (state.srcView) { state.srcView = null; renderApp(); }
    else if (state.guideOpen) closeGuide();
    return;
  }
  // the message to Jordan keeps focus inside its dialog
  if (e.key === 'Tab' && state.modal) {
    const items = [...document.querySelectorAll('.modal textarea, .modal button')];
    const first = items[0], last = items[items.length - 1];
    if (!items.includes(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('g-about')) state.aboutOpen = e.target.open; }, true);
/* "About this concept" unfolds and folds like the steps panel: the drawer's height animates, then it stays open or closes */
document.addEventListener('click', e => {
  const sum = e.target.closest && e.target.closest('.g-about > summary');
  if (!sum) return;
  const d = sum.parentElement, inner = d.querySelector('.in');
  if (reduceMotion() || !inner || !inner.animate) return;
  e.preventDefault();
  if (d.dataset.anim) return;
  const opening = !d.open;
  d.dataset.anim = '1';
  if (opening) d.open = true; else d.classList.add('closing');
  const h = inner.scrollHeight;
  inner.style.overflow = 'hidden';
  const a = inner.animate(opening ? [{ height: '0px', opacity: 0 }, { height: h + 'px', opacity: 1 }] : [{ height: h + 'px', opacity: 1 }, { height: '0px', opacity: 0 }],
    { duration: opening ? 340 : 260, easing: opening ? 'cubic-bezier(.16, 1, .3, 1)' : 'cubic-bezier(.4, 0, .2, 1)' });
  a.onfinish = () => { inner.style.overflow = ''; if (!opening) { d.open = false; d.classList.remove('closing'); } delete d.dataset.anim; };
});

/* drag a step to another day (the step's menu does the same with the keyboard) */
document.addEventListener('dragstart', e => {
  const li = e.target.closest && e.target.closest('[data-drag]');
  if (!li) return;
  dragId = li.dataset.drag;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
  li.classList.add('dragging');
});
document.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.dragging, .day.drop').forEach(x => x.classList.remove('dragging', 'drop'));
});
document.addEventListener('dragover', e => {
  const day = dragId && e.target.closest && e.target.closest('.day');
  if (!day) return;
  e.preventDefault();
  document.querySelectorAll('.day.drop').forEach(x => { if (x !== day) x.classList.remove('drop'); });
  day.classList.add('drop');
});
document.addEventListener('drop', e => {
  const day = dragId && e.target.closest && e.target.closest('.day');
  if (!day) return;
  e.preventDefault();
  startClock();
  moveStep(dragId, Number(day.dataset.day));
});

/* any input from the person restarts the wait before the hint */
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(type => document.addEventListener(type, markActive, { capture: true, passive: true }));

/* the wheel scrolls the left panel from anywhere on the page, except where something else scrolls (the window, the steps dropdown) */
document.addEventListener('wheel', e => {
  if (isMobile() || e.ctrlKey || e.target.closest('#intro, #screen, .g-full')) return;
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
  $('#intro').scrollTop += e.deltaY * unit;
}, { passive: true });

/* the portfolio's pointer glow and card spotlight */
let glowFrame = 0;
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || glowFrame) return;
  glowFrame = requestAnimationFrame(() => {
    glowFrame = 0;
    const page = $('.page');
    page.style.setProperty('--gx', e.clientX + 'px'); page.style.setProperty('--gy', e.clientY + 'px');
    const card = e.target.closest && e.target.closest('.c-spot');
    if (card) { const r = card.getBoundingClientRect(); card.style.setProperty('--sx', (e.clientX - r.left) + 'px'); card.style.setProperty('--sy', (e.clientY - r.top) + 'px'); }
  });
});

// the left panel is drawn once (and again only for a new language), so its entrance never replays on a click
renderIntro();
render();
ringLoop();
setTimeout(() => $('.page').classList.remove('boot'), 2200);
})();
</script>
</body>
</html>
