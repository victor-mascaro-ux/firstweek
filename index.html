:root{
  /* app (fictional Firstweek product, used by Acme) */
  --bg:#F6F6F9; --surface:#FFFFFF; --ink:#17181D; --muted:#5E6272; --line:#E4E5EC; --line-strong:#BCC0CC; --well:#EEEFF4;
  --brand:#5B3FD6; --brand-hover:#4A30BD; --brand-soft:#EEEAFE; --brand-ink:#3A2598;
  --warn-bg:#FFF5DB; --warn-line:#E8C77A; --warn-ink:#6B4700;
  --human:#0E6B4E; --human-soft:#E6F3ED; --human-line:#A9D5C1;
  --error:#B42318; --focus:#2457D6;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* page: Victor's portfolio design system (dark theme) */
  --navy:#0A1430; --navy-2:#111E43; --navy-3:#16264F; --navy-line:#1E2C56; --navy-line-2:#2A3A69;
  --ice:#EEF3FF; --ice-2:#C5D0EA; --ice-muted:#8E9CC2;
  --neon:#4FC3F7; --neon-ink:#06122B; --neon-soft:#102E57; --gold:#FFC83D;
  --dot:rgba(120,170,255,.10); --glow:rgba(79,195,247,.12);
  --card-glow:0 0 48px -4px rgba(79,195,247,.42),0 0 130px -16px rgba(79,195,247,.3);
  --frame-line:#2B3557; --frame-shade:rgba(0,0,0,.5);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1); --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --card-gap:32px; /* one gap between every block in the concept */
  --gold-text:#FFC83D; --neon-line:rgba(79,195,247,.35); --track:#24325E; --ok-bg:#103B33; --ok-ink:#7FE0B5; --try-glow:rgba(79,195,247,.6); --ghost-line:rgba(197,208,234,.5);
  --pop-shadow:0 2px 6px rgba(0,0,0,.4),0 36px 72px -18px rgba(0,0,0,.75);
}
/* light theme: the portfolio's light tokens under the same names (the names come from the dark theme).
   It follows the system unless the sun/moon button made a choice */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --navy:#EEF3FA; --navy-2:#F8FAFD; --navy-3:#E7EEF8; --navy-line:#D2DCEB; --navy-line-2:#B8C6DC;
    --ice:#0B1530; --ice-2:#26345A; --ice-muted:#4F5F82;
    --neon:#0B63C9; --neon-ink:#FFFFFF; --neon-soft:#DCE9FB; --neon-line:rgba(11,99,201,.28);
    --gold:#F2B705; --gold-text:#7E5600; --dot:rgba(11,21,48,.12); --glow:rgba(11,99,201,.10);
    --card-glow:0 0 44px -6px rgba(11,99,201,.3),0 0 110px -20px rgba(11,99,201,.22);
    --track:#D2DCEB; --ok-bg:#DDF3E8; --ok-ink:#0B6B4A; --try-glow:rgba(11,99,201,.35); --ghost-line:#8FA0BF;
    --pop-shadow:0 2px 6px rgba(11,21,48,.08),0 32px 64px -16px rgba(11,21,48,.3);
    --frame-line:#C3CEE0; --frame-shade:rgba(11,21,48,.22);
  }
}
:root[data-theme="light"]{
    --navy:#EEF3FA; --navy-2:#F8FAFD; --navy-3:#E7EEF8; --navy-line:#D2DCEB; --navy-line-2:#B8C6DC;
    --ice:#0B1530; --ice-2:#26345A; --ice-muted:#4F5F82;
    --neon:#0B63C9; --neon-ink:#FFFFFF; --neon-soft:#DCE9FB; --neon-line:rgba(11,99,201,.28);
    --gold:#F2B705; --gold-text:#7E5600; --dot:rgba(11,21,48,.12); --glow:rgba(11,99,201,.10);
    --card-glow:0 0 44px -6px rgba(11,99,201,.3),0 0 110px -20px rgba(11,99,201,.22);
    --track:#D2DCEB; --ok-bg:#DDF3E8; --ok-ink:#0B6B4A; --try-glow:rgba(11,99,201,.35); --ghost-line:#8FA0BF;
    --pop-shadow:0 2px 6px rgba(11,21,48,.08),0 32px 64px -16px rgba(11,21,48,.3);
    --frame-line:#C3CEE0; --frame-shade:rgba(11,21,48,.22);
}
/* the switch reveals the new theme in a circle from the button, as in the portfolio */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ice);font:17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
::selection{background:#FFD84D;color:#382800}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* design system rule: an icon next to text sits on the text's first line, never centered on the whole block.
   Align the row to the top (align-items:flex-start) and nudge the icon down by half the difference
   between the line height and the icon size: margin-top:calc((line-height - icon size) / 2). */

/* ================= Page layout ================= */
/* desktop: left: the context · right: steps bar above a browser window. A dotted canvas with a glow that follows the pointer, like the portfolio */
body{overflow:auto;background:radial-gradient(var(--dot) 1px,transparent 1.3px) 0 0/24px 24px,var(--navy)}
/* a desktop prototype uses the mobile pattern: no left panel, the steps bar on top, and the concept in its dropdown */
.page{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"stage";max-width:1440px;margin:0 auto;padding:20px 28px 24px;height:100vh;height:100dvh}
.page>.concept{display:none}
.page::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(560px circle at var(--gx,80%) var(--gy,37%),var(--glow),transparent 65%)}
/* language button: the portfolio's tool button, with the current language's flag and code */
.tool{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--navy-line);border-radius:10px;background:var(--navy-2);color:var(--ice);font-size:.8125rem;font-weight:600;cursor:pointer;transition:background-color .18s,border-color .18s,color .18s,transform .18s var(--ease)}
.tool:hover{border-color:var(--navy-line-2)}
.tool.lang-btn{gap:7px;padding:0 11px 0 10px}
.lang-flag{width:20px;height:14px;object-fit:cover;object-position:left center;border-radius:3px;box-shadow:0 0 0 1px var(--navy-line);flex:none}
.lang-code{font-family:var(--f-mono);font-size:.74rem;font-weight:700;letter-spacing:.04em}
.flag-br:not(:lang(pt-BR)),.flag-us:lang(pt-BR){display:none}
/* theme button, as in the portfolio: a sun in light, a moon in dark */
.c-tools{display:flex;gap:8px}
.tool.icon{width:38px;padding:0;justify-content:center}
.tool.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:iconIn .5s var(--ease-pop)}
.i-moon{display:none}
:root[data-theme="dark"] .i-sun{display:none}
:root[data-theme="dark"] .i-moon{display:block}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .i-sun{display:none}
  :root:not([data-theme="light"]) .i-moon{display:block}
}
@keyframes iconIn{from{opacity:0;transform:rotate(-90deg) scale(.5)}}
.stage{grid-area:stage;position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.mini-av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#FDE7D9;color:#8A3B12;font-size:10px;font-weight:700}
.mini-av.nina{background:#E2EEFF;color:#1D4E9E}
/* the browser window: Firstweek is a desktop web app */
.browser{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:6px;overflow:hidden;background:#E3E5EC}
/* each person's laptop: Omar's a dark Mac-style one with a camera notch and a space-gray base,
   Nina's a light silver one with a deeper chin and a silver base; the bezel changes with the switch */
.laptop{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  --bz:12px;--bz-top:14px;--bz-bottom:12px;--bz-r:18px;--bz-bg:#0E0F12;--bz-edge:#2B2E36;--deck:linear-gradient(#5B5F69,#2B2E35);--deck-r:0 0 16px 16px}
.laptop.is-nina{--bz:14px;--bz-bottom:30px;--bz-r:12px;--bz-bg:#EEF1F6;--bz-edge:#C9D0DC;--deck:linear-gradient(#E6EAF0,#B7BFCB);--deck-r:0 0 10px 10px}
.lid{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;padding:var(--bz-top) var(--bz) var(--bz-bottom);border-radius:var(--bz-r) var(--bz-r) 5px 5px;background:var(--bz-bg);box-shadow:inset 0 0 0 1px var(--bz-edge),0 0 0 1px var(--frame-line),0 40px 90px var(--frame-shade),var(--card-glow);transition:background-color .45s,padding .45s,border-radius .45s}
/* Try it: the laptop's glow swells once and settles, to say "over here" */
.lid.look{animation:look 1.3s ease-in-out}
@keyframes look{35%{box-shadow:inset 0 0 0 1px var(--bz-edge),0 0 0 2px var(--neon),0 40px 90px var(--frame-shade),0 0 64px 4px rgba(79,195,247,.7),0 0 160px 10px rgba(79,195,247,.4)}}
/* the camera: a notch on Omar's, a small dot on Nina's */
.cam{position:absolute;z-index:2;top:0;left:50%;width:96px;height:12px;margin-left:-48px;border-radius:0 0 8px 8px;background:var(--bz-bg)}
.cam::after{content:"";position:absolute;left:50%;top:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#2A3346}
.is-nina .cam{top:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#7B8496}
.is-nina .cam::after{display:none}
/* Nina's chin carries a small maker's mark */
.chin-mark{position:absolute;left:50%;bottom:11px;width:34px;height:7px;margin-left:-17px;border-radius:4px;background:#C3CAD6;opacity:0;transition:opacity .3s}
.is-nina .chin-mark{opacity:1}
.deck{position:relative;flex:none;width:104%;height:14px;border-radius:var(--deck-r);background:var(--deck);box-shadow:0 20px 40px var(--frame-shade)}
.deck::before{content:"";position:absolute;left:50%;top:0;width:14%;height:5px;transform:translateX(-50%);border-radius:0 0 6px 6px;background:rgba(0,0,0,.28)}
.is-nina .deck::before{width:18%;height:4px;background:rgba(0,0,0,.12)}
/* each laptop is its own computer: Omar's a dark Mac-style window, Nina's a light blue Windows-style one,
   each with its own other tab open and its owner's avatar */
.laptop{--chrome:#DADDE6;--chrome-line:#C9CDD8;--tab-bg:var(--bg);--tab-ink:#30343C;--tab-dim:#5A5F6B;--url-bg:#F2F3F7;--url-ink:#4B4F5C}
.laptop.is-omar{--chrome:#2A2D35;--chrome-line:#16171C;--tab-bg:#3B3F4A;--tab-ink:#F2F3F7;--tab-dim:#A3A8B5;--url-bg:#1C1E24;--url-ink:#C9CDD8}
.laptop.is-nina{--chrome:#DCE6F7;--chrome-line:#C3D1EC;--tab-bg:#FFFFFF;--tab-ink:#1D2A44;--tab-dim:#55627E;--url-bg:#FFFFFF;--url-ink:#3B4A66}
.b-bar{flex:none;display:flex;align-items:flex-end;gap:10px;height:42px;padding:0 14px;background:var(--chrome);border-bottom:1px solid var(--chrome-line);transition:background-color .4s,border-color .4s}
.b-dots{display:flex;gap:7px;align-self:center}
.b-dots i{width:12px;height:12px;border-radius:50%;background:#FF5F57}
.b-dots i:nth-child(2){background:#FEBC2E}
.b-dots i:nth-child(3){background:#28C840}
.b-tabs{display:flex;gap:2px;margin-left:4px;min-width:0}
.b-tab{display:flex;align-items:center;gap:8px;height:32px;padding:0 16px 0 12px;border-radius:9px 9px 0 0;background:var(--tab-bg);font:600 13px/1 var(--font);color:var(--tab-ink);white-space:nowrap}
.b-tab.dim{background:transparent;color:var(--tab-dim);font-weight:500}
.b-tab .mini-logo{display:grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--brand);color:#fff}
.b-tab .mini-logo svg{width:11px;height:11px}
.b-tab .tab-ic{width:14px;height:14px;border-radius:4px;background:currentColor;opacity:.45}
.b-url{align-self:center;margin-left:6px;padding:5px 12px;border-radius:999px;background:var(--url-bg);font:500 12.5px/1 var(--font);color:var(--url-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.b-who{align-self:center;margin-left:auto}
.b-who .mini-av{width:24px;height:24px}
/* Windows-style controls: minimize, maximize, close */
.b-win{display:flex;align-self:stretch;margin:0 -14px 0 0}
.b-win i{position:relative;width:42px;color:var(--tab-dim)}
.b-win i::before,.b-win i::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.b-win .min::before{width:10px;height:1.5px;background:currentColor}
.b-win .max::before{width:9px;height:9px;border:1.5px solid currentColor;border-radius:1px}
.b-win .x::before,.b-win .x::after{width:12px;height:1.5px;background:currentColor;transform:translate(-50%,-50%) rotate(45deg)}
.b-win .x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.screen{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);container:app/inline-size}

/* ================= Context (left) ================= */
/* scrolls without a visible bar; the bottom edge fades to show there's more */
.concept{grid-area:panel;min-height:0;overflow-y:auto;padding:24px 8px 56px 0;color:var(--ice);scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 56px),transparent);mask-image:linear-gradient(#000 calc(100% - 56px),transparent)}
.concept::-webkit-scrollbar{display:none}
.concept :focus-visible{outline-color:var(--neon)}
.concept a{color:var(--neon);text-underline-offset:3px;transition:text-underline-offset .18s var(--ease)}
.concept a:hover{text-underline-offset:5px}
.concept a.g-btn{color:var(--neon-ink)}
.concept a.g-btn.ghost{color:var(--ice)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px}
.c-eyebrow,.c-label{margin:0;font:600 .72rem/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ice-muted)}
.c-eyebrow{display:inline-flex;align-items:center;gap:10px}
/* rotated, the diamond is wider than its box; the 2px keeps its left tip inside the scrolling panel */
.c-eyebrow::before{content:"";width:8px;height:8px;margin-left:2px;border-radius:2px;background:var(--gold);transform:rotate(45deg);flex:none}
/* the title is the headline; the medium comes second, in the accent with the portfolio's gold underline */
.c-title{margin:0 0 40px;font:700 clamp(36px,1.2rem + 2.3vw,58px)/.98 var(--f-display);letter-spacing:-.03em;font-variation-settings:"opsz" 96;text-wrap:balance}
.c-title .w{display:inline-block}
.c-title em{font-style:normal;color:var(--neon);padding-bottom:.08em;background-image:linear-gradient(var(--gold),var(--gold)),repeating-linear-gradient(90deg,var(--navy-line-2) 0 calc(10% - 3px),transparent calc(10% - 3px) 10%);background-repeat:no-repeat;background-position:0 96%,0 96%;background-size:0% .09em,100% .09em;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:xpfill 1.4s var(--ease-out) 1.1s forwards}
@keyframes xpfill{to{background-size:100% .09em,100% .09em}}
/* the problem sits on the page, no box: the gold label, one number, then what it means.
   Only the solution is a card, so it's the one thing that stands out */
.c-problem{margin:0 0 var(--card-gap)}
.c-problem .c-label{display:flex;align-items:center;gap:8px;margin:0 0 14px;color:var(--gold-text)}
.c-problem .c-label svg.i{width:16px;height:16px}
/* every prototype's problem has a number: it leads, large and gold, beside the sentence it counts.
   The number is exactly two lines tall: in Bricolage, digits and ascenders are .70 of the font size,
   so the number is (1.28 + .70) / .70 = 2.83 × the sentence's size, and its margin lines its top up with the first line */
.c-stat{--p-fs:clamp(19px,.95rem + .5vw,23px);display:flex;align-items:flex-start;gap:18px}
.c-num{flex:none;margin:calc(2px - var(--p-fs) * .1) 0 0;font:650 calc(var(--p-fs) * 2.83)/1 var(--f-display);letter-spacing:-.035em;color:var(--gold-text);font-variation-settings:"opsz" 96}
.c-problem-txt{margin:2px 0 0;font:650 var(--p-fs)/1.28 var(--f-display);letter-spacing:-.015em;color:var(--ice)}
/* the source belongs to the claim, so it sits right under it, from the number's left edge */
.c-source{margin:10px 0 0;font-size:13px;line-height:1.5;color:var(--ice-muted)}
/* cards with the portfolio's spotlight and border light that follow the pointer */
.c-spot{position:relative;isolation:isolate;--sx:50%;--sy:50%;--spot:var(--neon);--spot-glow:var(--glow)}
.c-spot::before,.c-spot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s}
.c-spot::before{z-index:-1;background:radial-gradient(420px circle at var(--sx) var(--sy),var(--spot-glow),transparent 60%)}
.c-spot::after{z-index:1;padding:1.5px;background:radial-gradient(260px circle at var(--sx) var(--sy),var(--spot),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.c-spot:hover::before,.c-spot:hover::after{opacity:1}
/* the solution is the highlight of the page: the only card, flat blue with a thin blue border */
.c-solution{margin:0 0 var(--card-gap);padding:24px 24px 26px;border-radius:22px;background:var(--neon-soft);border:1px solid var(--neon-line)}
.c-solution .c-label{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--neon)}
.c-solution .c-label svg.i{width:16px;height:16px}
.c-why{margin:0;font:600 clamp(19px,.95rem + .55vw,24px)/1.36 var(--f-display);letter-spacing:-.015em;color:var(--ice-2)}
/* highlights are colored words, no underline, one per block: blue in the solution (the problem's gold is its number) */
.c-why b{font-weight:700;color:var(--neon)}
/* try it: points at the window; a click shows the next step there right away */
.c-try{display:flex;align-items:center;gap:16px;width:100%;margin:0 0 var(--card-gap);padding:16px 16px 16px 20px;border:0;border-radius:14px;background:var(--neon);color:var(--neon-ink);text-align:left;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);transition:transform .18s var(--ease),box-shadow .18s}
.c-try:hover{transform:translateY(-2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 12px 30px -10px var(--try-glow)}
.c-try:active{transform:scale(.98);transition-duration:.08s}
.c-try-txt{flex:1;font-size:15px;line-height:1.45;font-weight:500}
.c-try strong{display:block;margin-bottom:2px;font:700 20px/1.2 var(--f-display);letter-spacing:-.01em}
.c-try-go{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--neon-ink);color:var(--neon);animation:nudge 1.1s var(--ease) 2.4s 5}
.c-try-go svg.i{width:22px;height:22px;stroke-width:2.2}
.c-try:hover .c-try-go{animation:nudge 1.1s var(--ease) infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
/* design decisions: a plain list on the page, no box; the numbers are quiet mono, on the title's first line */
.c-decisions{margin:0 0 var(--card-gap)}
.c-decisions .c-label{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.c-decisions .c-label svg.i{width:16px;height:16px}
.c-list{display:grid;gap:18px;margin:0;padding:0;list-style:none}
.c-list li{display:flex;align-items:flex-start;gap:12px;font-size:15px;line-height:1.5;color:var(--ice-2)}
.c-list b{display:block;margin-bottom:3px;font:650 17px/1.3 var(--f-display);letter-spacing:-.01em;color:var(--ice)}
.c-n{flex:none;min-width:20px;font:700 12px/22px var(--f-mono);color:var(--ice-muted)}
.c-cta{padding:22px;border-radius:22px;background:var(--navy-2);border:1px solid var(--navy-line)}
.c-cta p{margin:0 0 14px;font:650 21px/1.25 var(--f-display);letter-spacing:-.015em}
.c-cta-q{display:flex;align-items:flex-start;gap:10px;--ic:24px}
.c-cta-q svg.i{width:var(--ic);height:var(--ic);margin-top:calc((1.25em - var(--ic)) / 2);color:var(--neon)}
/* in the steps panel the question takes the panel cards' text size; the layout stays the same */
.g-full .c-cta p{font-size:19px}
.g-full .c-cta-q{--ic:22px}
/* a desktop prototype: the two buttons stack, one on top of the other */
.c-cta .row{display:flex;flex-direction:column;gap:10px}
.c-cta .g-btn{width:100%;flex:none;padding:10px 18px;line-height:1.25;text-align:center;white-space:nowrap}
/* the icon sits inline at the start of the label, so a label that wraps keeps it on the first line */
.c-cta .g-btn svg.i{display:inline-block;width:18px;height:18px;margin-right:8px;vertical-align:middle;fill:none;stroke-width:2}

/* ================= Steps bar (above the window, like the mobile view) ================= */
.guide{position:relative;z-index:60;flex:none;color:var(--ice);animation:rise .8s var(--ease-out) .55s backwards}
.guide :focus-visible{outline-color:var(--neon)}
.g-compact{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 12px;background:var(--navy-2);border:1px solid var(--navy-line);border-radius:14px;transition:border-radius .15s}
/* open, the bar and the panel are one card: the bar squares off at the bottom and the panel grows out of it */
.guide.open .g-compact{border-radius:14px 14px 0 0}
.g-step{flex:none;padding:3px 8px;border-radius:7px;background:var(--neon-soft);border:1px solid var(--neon-line);color:var(--neon);font:700 12px/1.4 var(--f-mono)}
.g-who{flex:none;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--navy-3);font-size:12.5px;font-weight:600;color:var(--ice-2);white-space:nowrap}
.g-ctitle{flex:1;min-width:0;margin:0;font:650 16px/1.3 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-show-sm{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:10px;background:var(--neon);color:var(--neon-ink);font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.g-show-sm svg.i{display:none}
.g-expand{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--ice);cursor:pointer;transition:background-color .18s}
.g-expand:hover{background:var(--navy-3)}
.g-expand svg{transition:transform .35s var(--ease-pop)}
.guide.open .g-expand svg{transform:rotate(180deg)}
.guide.opening .g-expand svg{animation:turn .35s var(--ease-pop)}
@keyframes turn{from{transform:none}}
.g-full{display:none;position:absolute;top:100%;left:0;right:0;max-height:calc(100dvh - 140px);overflow-y:auto;flex-direction:column;gap:16px;padding:16px 18px;background:var(--navy-2);border:1px solid var(--navy-line);border-top:0;border-radius:0 0 14px 14px;box-shadow:var(--pop-shadow);scrollbar-width:none}
.g-full .g-card{padding:0;background:none;border:0;border-radius:0}
/* the full-width dropdown: the task on the left; the concept, contact and start over on the right (one column on phones) */
.g-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 36px;align-items:start}
.g-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.g-full::-webkit-scrollbar{display:none}
/* the panel unfolds from the bar and folds back up; while it's open the bar is just its header */
.guide.open .g-full{display:flex}
.guide.opening .g-full{animation:unfold .32s var(--ease-out)}
.guide.closing .g-full{animation:fold .28s cubic-bezier(.4,0,.2,1) forwards}
.guide.settling .g-ctitle,.guide.settling .g-show-sm,.guide.settling .g-who{animation:swapin .3s var(--ease-out)}
.guide.closing .g-expand svg{transform:none}
.g-howto{display:none;flex:1;min-width:0;margin:0;font:650 16px/1.3 var(--f-display);letter-spacing:-.01em}
.guide.open .g-ctitle,.guide.open .g-show-sm,.guide.open .g-who{display:none}
.guide.open .g-howto{display:block}
.guide.opening .g-howto{animation:swapin .3s var(--ease-out)}
@keyframes unfold{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes fold{to{clip-path:inset(0 0 100% 0)}}
.g-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.g-name{margin:0;font:700 22px/1.2 var(--f-display);letter-spacing:-.02em}
.g-dashes{display:flex;gap:5px}
.g-dashes i{flex:1;height:4px;border-radius:2px;background:var(--track)}
.g-dashes i.done{background:var(--neon)}
.g-dashes i.now{background:linear-gradient(90deg,var(--neon) 50%,var(--track) 50%)}
.g-label{margin:0;font:600 .72rem/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ice-muted)}
.g-card{padding:18px;border-radius:14px;background:var(--navy-2);border:1px solid var(--navy-line)}
.g-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--navy-3);font-size:12.5px;font-weight:600;color:var(--ice)}
.g-chip.ok{padding-left:10px;background:var(--ok-bg);color:var(--ok-ink)}
.g-chip svg.i{width:16px;height:16px}
.g-title{margin:12px 0 8px;font:700 23px/1.15 var(--f-display);letter-spacing:-.02em}
.g-desc{margin:0 0 16px;font-size:15px;line-height:1.55;color:var(--ice-2)}
/* buttons: the portfolio's lift, press and shine sweep */
.g-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 22px;border:1.5px solid transparent;border-radius:12px;background:var(--neon);color:var(--neon-ink);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.g-btn,.g-show-sm{position:relative;overflow:hidden;transition:transform .18s var(--ease),background-color .18s,border-color .18s,box-shadow .18s}
.g-btn:hover,.g-show-sm:hover{transform:translateY(-2px)}
.g-btn:active,.g-show-sm:active{transform:scale(.96);transition-duration:.08s}
.g-btn:not(.ghost)::after,.g-show-sm::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-110%)}
.g-btn:not(.ghost):hover::after,.g-show-sm:hover::after{transform:translateX(110%);transition:transform .75s var(--ease-out)}
.g-btn svg.i{width:16px;height:16px;fill:currentColor}
/* the done card's contact buttons: outline icons, as in the contact card */
.g-card a.g-btn svg.i{display:inline-block;width:18px;height:18px;margin-right:8px;vertical-align:middle;fill:none;stroke-width:2}
.g-btn.ghost{background:transparent;color:var(--ice);border-color:var(--ghost-line);box-shadow:none}
.g-btn.ghost:hover{border-color:var(--ice);background:var(--navy-2)}
.g-btn[aria-disabled="true"],.g-show-sm[aria-disabled="true"]{opacity:.75;cursor:progress;transform:none;background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.1s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
/* on the wrong laptop, the steps bar's button takes you to the right one, with a slow glow to say "this first" */
.g-btn.go,.g-show-sm.go{animation:goGlow 1.8s ease-in-out infinite}
.g-btn.go svg.i{fill:none;stroke-width:2;width:18px;height:18px}
@keyframes goGlow{50%{box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 4px var(--neon-soft),0 0 22px 2px rgba(79,195,247,.45)}}
.g-help{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--ice-muted);text-align:center}
.g-stack{display:flex;flex-direction:column;gap:10px}
.g-about{border:1px solid var(--navy-line);border-radius:14px}
.g-about summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 14px;cursor:pointer;font-size:14px;font-weight:600;list-style:none}
.g-about summary::-webkit-details-marker{display:none}
.g-about summary svg{transition:transform .35s var(--ease-pop)}
.g-about[open] summary svg{transform:rotate(180deg)}
.g-about.closing summary svg{transform:none}
/* the drawer shows the same parts as the left panel, a little tighter */
.g-about .in{padding:0 12px 12px;color:var(--ice-2)}
/* the drawer opens with the same eyebrow as the left panel: which prototype this is */
.g-eyebrow{margin:2px 0 16px}
.g-about a{color:var(--neon)}
.g-about .c-solution{padding:18px}
.g-about .c-decisions{margin:0}
.g-about .c-why{font-size:19px}
.g-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:4px}
.g-restart{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;background:none;color:var(--ice-muted);font-size:14px;font-weight:600;cursor:pointer;transition:color .18s}
.g-restart:hover{color:var(--ice)}
.g-restart svg{transition:transform .5s var(--ease-out)}
.g-restart:hover svg{transform:rotate(-200deg)}

/* pulsing ring (guide layer, drawn over the window) */
.ring{position:absolute;z-index:35;pointer-events:none;border:3px solid var(--neon);border-radius:14px;opacity:0;transition:opacity .3s;box-shadow:0 0 0 0 rgba(79,195,247,.55);animation:pulse 1.5s ease-out infinite}
.ring.on{opacity:1}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,195,247,.55)}100%{box-shadow:0 0 0 14px rgba(79,195,247,0)}}
.demo-press{transform:scale(.96);transition:transform .12s}

/* ================= Page motion ================= */
/* one orchestrated entrance (like the portfolio's hero), then small responses to input */
.boot .c-top{animation:rise .7s var(--ease-out) .05s backwards}
.boot .c-eyebrow::before{animation:spinIn .8s var(--ease-pop) .2s backwards}
.boot .c-title .w{animation:wordUp .95s var(--ease-out) backwards;animation-delay:calc(.12s + var(--wi,0) * 55ms)}
.boot .concept>:nth-child(n+3){animation:rise .8s var(--ease-out) backwards;animation-delay:calc(.35s + var(--i,0) * 80ms)}
.boot .laptop{animation:winIn 1s var(--ease-out) .25s backwards}
/* the steps bar when the task changes (--age keeps it smooth across re-renders) */
.g-compact.swap{animation:glow 1s var(--ease-out) var(--age,0s)}
.g-compact.swap .g-step{animation:pop .5s var(--ease-pop) var(--age,0s) backwards}
.g-compact.swap .g-ctitle,.g-compact.swap .g-who{animation:swapin .45s var(--ease-out) var(--age,0s) backwards}
/* language switch, as in the portfolio: the flag flips over like a card, the code rolls in,
   and the text on screen types itself in again; the part not yet typed keeps its space, headings carry a caret */
.lang-btn.is-flipping .lang-flag{animation:flagFlip .7s var(--ease-pop) both}
.lang-btn.is-flipping .lang-code{display:inline-block;animation:codeRoll .5s var(--ease-out) .12s both}
.tw-off{visibility:hidden}
.tw-head .tw-on{position:relative}
.tw-head.is-typing .tw-on::after{content:"";position:absolute;right:-3px;top:.08em;bottom:.02em;width:2px;border-radius:1px;background:var(--neon);animation:caretBlink .45s steps(1) infinite}
@keyframes flagFlip{from{transform:perspective(80px) rotateY(-180deg) scale(.8)}}
@keyframes codeRoll{from{opacity:0;transform:translateY(80%)}}
@keyframes caretBlink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes wordUp{from{opacity:0;transform:translateY(.5em) rotate(3deg);filter:blur(8px)}}
@keyframes spinIn{from{transform:rotate(-135deg) scale(.3)}}
@keyframes winIn{from{opacity:0;transform:translate3d(0,40px,0) scale(.97)}}
@keyframes swapin{from{opacity:0;transform:translateY(8px)}}
@keyframes glow{from{border-color:var(--neon);box-shadow:0 0 0 0 rgba(79,195,247,.45)}to{box-shadow:0 0 0 12px rgba(79,195,247,0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}

/* ================= App (fictional product: Firstweek, at Acme) ================= */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view.in{animation:fade .3s ease-out}
/* already on screen before the redraw: no entrance again */
.still{animation:none!important}
.app-head{flex:none;display:flex;align-items:center;gap:20px;height:56px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff}
.logo svg{width:18px;height:18px}
.ws{padding:2px 8px;border-radius:6px;background:var(--well);color:var(--muted);font-size:12.5px;font-weight:600}
.nav{display:flex;gap:2px;align-self:stretch}
.nav button{padding:0 12px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 -2px 0 transparent;transition:color .15s}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand);cursor:default}
.head-end{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.who{display:flex;flex-direction:column;align-items:flex-end;font-size:13px;line-height:1.3;color:var(--muted);white-space:nowrap}
.who b{color:var(--ink);font-weight:600}
.avatar{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:50%;background:#FDE7D9;color:#8A3B12;font-weight:700;font-size:12.5px}
.avatar.nina{background:#E2EEFF;color:#1D4E9E}
.avatar.jordan{background:#DDE7E2;color:#0B4F3A}
.avatar.sm{width:28px;height:28px;font-size:11px}
.avatar.big{width:64px;height:64px;font-size:22px}
.body{flex:1;min-height:0;display:flex;position:relative}
h1:focus,h2:focus{outline:none}
.meta{margin:2px 0 0;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill svg.i{width:15px;height:15px}
.pill.ai{background:var(--brand-soft);color:var(--brand-ink)}
.pill.ok{background:var(--human-soft);color:var(--human);animation:pop .45s var(--ease-pop)}
.pill.sm{padding:2px 8px;font-size:11.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;line-height:1.2;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .12s}
.btn:active{transform:scale(.97)}
.btn svg.i{width:18px;height:18px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover)}
.btn-plain{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-strong)}
.btn-plain:hover{border-color:var(--ink)}
.btn-sm{min-height:38px;padding:0 14px;font-size:14px}
.link-btn{padding:0;border:0;background:none;color:var(--brand-ink);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;flex:none;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;transition:background-color .15s}
.icon-btn:hover{background:var(--well)}
.input{width:100%;min-height:42px;padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:15px;transition:border-color .15s}
.input:focus{border-color:var(--focus);outline:3px solid rgba(36,87,214,.22);outline-offset:0}
.spinner{width:16px;height:16px;flex:none;border:2.5px solid #D6D3EA;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* where an AI-drafted step came from: a source chip (a person-added step says so instead) */
.src{display:inline-flex;align-items:flex-start;gap:5px;max-width:100%;padding:3px 9px 3px 7px;border:0;border-radius:7px;background:var(--brand-soft);color:var(--brand-ink);font-size:12px;font-weight:600;line-height:1.4;text-align:left;cursor:pointer;transition:background-color .15s}
.src:hover{background:#E2DBFD}
.src svg.i{width:14px;height:14px;margin-top:calc((1.4em - 14px) / 2)}
.src b{font-weight:700}
.src.custom{background:var(--well);color:var(--muted);cursor:default}

/* Omar's side: the first-week board */
.plan{flex:1;min-width:0;display:flex;flex-direction:column}
.plan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 18px 14px 22px}
.plan-head h1{margin:0;font-size:22px;line-height:1.25;letter-spacing:-.015em}
.ph-end{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
/* rows size to their content, so a long day scrolls the board instead of squeezing its cards */
.board{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);grid-auto-rows:max-content;gap:10px;align-items:start;padding:2px 18px 22px;overflow:auto}
.day{display:flex;flex-direction:column;gap:8px;min-height:220px;padding:10px;border-radius:14px;background:var(--well);border:2px solid transparent;transition:border-color .15s,background-color .15s}
.day.drop{border-color:var(--brand);border-style:dashed;background:var(--brand-soft)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin:0 2px;font-size:13px;font-weight:700}
.day-h span{color:var(--muted);font-weight:600}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.step{position:relative;padding:10px 10px 10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.05);cursor:grab}
.step:active{cursor:grabbing}
.step.dragging{opacity:.4}
.step.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:#E6E0FD;border-color:var(--brand)}}
.step-t{margin:0 26px 8px 0;font-size:14px;font-weight:600;line-height:1.35}
.step-menu-btn{position:absolute;top:5px;right:4px;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
.step-menu-btn:hover,.step-menu-btn[aria-expanded="true"]{background:var(--well);color:var(--ink)}
.step-menu-btn svg.i{width:18px;height:18px}
.menu{position:absolute;z-index:20;top:36px;right:4px;width:200px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 12px 32px rgba(16,24,40,.18);animation:drop .18s var(--ease-out)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.menu-h{margin:0 4px 6px;color:var(--muted);font-size:12px;font-weight:600}
.menu-days{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:6px}
.menu-days button{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.menu-days button:hover{border-color:var(--brand);color:var(--brand-ink)}
.menu-days button[aria-disabled="true"]{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink);cursor:default}
.menu-rm{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 6px;border:0;border-top:1px solid var(--line);background:none;color:var(--error);font-size:13.5px;font-weight:600;cursor:pointer}
.menu-rm svg.i{width:16px;height:16px}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;border:1.5px dashed var(--line-strong);border-radius:10px;background:none;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s}
.add-btn:hover{border-color:var(--brand);color:var(--brand-ink)}
.add-btn svg.i{width:16px;height:16px}
.add-form{display:flex;flex-direction:column;gap:8px;padding:10px;border:1.5px solid var(--brand);border-radius:12px;background:var(--surface);animation:drop .18s var(--ease-out)}
.add-form .input{min-height:38px;font-size:14px}
.ideas-h{margin:0;color:var(--muted);font-size:12px;font-weight:600}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.idea{padding:4px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left}
.idea:hover{border-color:var(--brand);color:var(--brand-ink)}
.add-row{display:flex;gap:6px}
.add-row .btn{flex:1;padding:0 8px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
/* the answer Jordan gave, waiting to be kept for the next new hire */
.keep{display:flex;align-items:flex-start;gap:14px;margin:0 22px 14px;padding:14px 16px;border:1px solid var(--human-line);border-radius:14px;background:var(--human-soft);animation:rise .4s var(--ease-out)}
.keep-ic{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:10px;background:var(--human);color:#fff}
.keep-ic svg.i{width:18px;height:18px}
.keep-h{margin:0 0 4px;font-size:16px}
.keep p{margin:0 0 4px;font-size:14px}
.keep .keep-why{margin:6px 0 10px;color:var(--muted)}
.keep-row{display:flex;flex-wrap:wrap;gap:8px}
.keep-mini,.keep-done{display:flex;align-items:flex-start;gap:8px;margin:0 22px 14px;padding:10px 14px;border-radius:12px;background:var(--human-soft);color:var(--human);font-size:14px;font-weight:600}
.keep-mini{justify-content:space-between;align-items:center}
.keep-mini span,.keep-done{display:flex;gap:8px}
.keep-mini svg.i,.keep-done svg.i{width:18px;height:18px;margin-top:calc((1.5em - 18px) / 2)}
.keep-done{animation:rise .4s var(--ease-out)}
/* the side panel: the documents the AI drafted from, or one step's source */
.side{flex:none;width:300px;overflow-y:auto;padding:18px;border-left:1px solid var(--line);background:var(--surface)}
.side.open{animation:sideIn .28s var(--ease-out)}
@keyframes sideIn{from{opacity:0;transform:translateX(16px)}}
.side-label{margin:0 0 10px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.side-title{margin:0 0 12px;font-size:18px;line-height:1.3}
.link-back{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;padding:0;border:0;background:none;color:var(--brand-ink);font-size:13.5px;font-weight:600;cursor:pointer}
.link-back svg.i{width:16px;height:16px}
.docs{display:flex;flex-direction:column;gap:2px;margin:0 0 14px;padding:0;list-style:none}
.docs li{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}
.docs li>svg.i{width:18px;height:18px;color:var(--brand);margin-top:1px}
.docs li span{display:flex;flex-direction:column;min-width:0;flex:1;font-size:13px;color:var(--muted)}
.docs li b{color:var(--ink);font-size:14px;font-weight:600}
.side-note{display:flex;gap:8px;margin:0;color:var(--muted);font-size:13px}
.side-note svg.i{width:16px;height:16px;color:var(--brand);margin-top:calc((1.5em - 16px) / 2)}
.doc-card{margin:0 0 14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.doc-name{display:flex;align-items:flex-start;gap:6px;margin:0;font-weight:700;font-size:14px}
.doc-name svg.i{width:16px;height:16px;color:var(--brand);margin-top:calc((1.5em - 16px) / 2)}
.doc-upd{margin:0 0 10px;color:var(--muted);font-size:12.5px}
.doc-sec{margin:0 0 4px;font-size:13px}
/* the passage a step or an answer used: one bar down its left side, the words lightly marked */
.doc-pass{margin:0;padding-left:10px;border-left:3px solid var(--brand);font-size:14px}
mark{padding:1px 2px;border-radius:3px;background:var(--brand-soft);color:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* Nina's side: day 1 on the left, Ask on the right */
.nina-body{display:grid;grid-template-columns:minmax(250px,.85fr) minmax(330px,1.15fr);grid-template-rows:minmax(0,1fr)}
.week{grid-column:1;grid-row:1;min-height:0;overflow-y:auto;padding:22px}
.week h1{margin:0;font-size:24px;line-height:1.25;letter-spacing:-.015em}
.progress{height:6px;margin:14px 0 6px;border-radius:3px;background:var(--well);overflow:hidden}
.progress span{display:block;width:calc(var(--p) * 100%);height:100%;border-radius:3px;background:var(--brand);transition:width .4s var(--ease-out)}
.meta.sm{font-size:13px}
.checklist{display:flex;flex-direction:column;gap:8px;margin:14px 0 22px;padding:0;list-style:none}
.check{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .15s}
.check:hover{border-color:var(--line-strong)}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{display:grid;place-items:center;width:20px;height:20px;flex:none;margin-top:1px;border:1.5px solid var(--line-strong);border-radius:6px;color:transparent;transition:background-color .15s,border-color .15s}
.check .box svg.i{width:14px;height:14px;stroke-width:2.6}
.check input:checked + .box{background:var(--brand);border-color:var(--brand);color:#fff;animation:pop .3s var(--ease-pop)}
.check input:focus-visible + .box{outline:3px solid var(--focus);outline-offset:2px}
.check input:checked ~ .ct .ct-t{color:var(--muted);text-decoration:line-through}
.ct{display:flex;flex-direction:column;min-width:0}
.ct-t{font-weight:600;font-size:14.5px}
.ct-s{color:var(--muted);font-size:12.5px}
.week .h2{margin:0 0 8px;font-size:14px;color:var(--muted)}
.upcoming{margin:0;padding:0 0 0 18px;font-size:14px;color:var(--muted)}
.upcoming li{margin-bottom:4px}
/* the document opens in day 1's place (the same grid cell), so the answer and its source sit side by side */
.doc{grid-column:1;grid-row:1;position:relative;z-index:12;min-height:0;overflow-y:auto;padding:18px 22px 28px;background:var(--surface);border-right:1px solid var(--line);animation:sideIn .28s var(--ease-out)}
.doc-top{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
.doc-top .side-label{margin:0}
.doc-title{margin:0;font-size:20px;line-height:1.3}
.doc-s{margin:0 0 14px;padding:12px 14px;border-radius:12px}
.doc-s h3{margin:0 0 4px;font-size:14px}
.doc-s p{margin:0;font-size:14.5px}
.doc-s.cited{background:var(--brand-soft)}
.doc-s.cited mark{background:transparent;box-shadow:none;padding:0;font-weight:600}
.doc-s.added{border:1px dashed var(--human-line)}
.cited-tag{display:flex;align-items:flex-start;gap:6px;margin:8px 0 0!important;color:var(--brand-ink);font-size:12.5px!important;font-weight:700}
.cited-tag svg.i{width:14px;height:14px;margin-top:calc((1.5em - 14px) / 2)}
.added-tag{margin:6px 0 0!important;color:var(--human);font-size:12.5px!important;font-weight:600}
.ask{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}
.ask-head{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.ask-head h2{display:flex;align-items:center;gap:8px;margin:0;font-size:17px}
.ask-head h2 svg.i{width:18px;height:18px;color:var(--brand)}
.ask-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 20px}
.chat-empty{margin:auto 0;color:var(--muted);font-size:14px;text-align:center;padding:0 12px}
.msg{max-width:88%}
.msg.in{animation:msgIn .35s var(--ease-out)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
.msg p{margin:0}
.msg.me{align-self:flex-end;padding:9px 13px;border-radius:16px 16px 4px 16px;background:var(--brand);color:#fff}
.msg.out .to{margin-bottom:3px;font-size:12px;font-weight:700;opacity:.8}
.msg.out .to + p{white-space:pre-wrap}
.msg.ai{align-self:flex-start;max-width:94%}
.msg.ai .bubble{padding:11px 14px;border:1px solid #E3DFF7;border-radius:4px 16px 16px 16px;background:#F6F4FE}
.msg.think{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:4px 16px 16px 16px;background:#F6F4FE;color:var(--muted);font-size:14px}
.ai-label{display:flex;align-items:center;gap:6px;margin:0 0 4px!important;color:var(--brand-ink);font-size:12px;font-weight:700}
.ai-label .logo{width:18px;height:18px;border-radius:5px}
.ai-label .logo svg{width:12px;height:12px}
.msg.ai p + p{margin-top:6px}
.sources{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.sources-h{margin:0 2px 0 0!important;color:var(--muted);font-size:12px;font-weight:700}
/* two documents disagree: both side by side, the newer one used */
.conflict{margin-top:10px;padding:10px;border:1px solid var(--warn-line);border-radius:12px;background:var(--warn-bg)}
.conflict-h{display:flex;align-items:flex-start;gap:6px;margin:0 0 8px!important;color:var(--warn-ink);font-size:13px;font-weight:700}
.conflict-h svg.i{width:16px;height:16px;margin-top:calc((1.5em - 16px) / 2)}
.cf-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cf{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.cf b{color:var(--ink);font-size:17px}
.cf.old b{color:var(--muted);text-decoration:line-through}
.cf.new{border-color:var(--brand)}
.cf-tag{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
.cf.new .cf-tag{color:var(--brand-ink)}
.cf-tag svg.i{width:13px;height:13px;stroke-width:2.6}
.cf-why{margin:8px 0 0!important;font-size:13.5px;color:var(--ink)}
.handoff{color:var(--muted)}
.msg.ai .btn{margin-top:10px}
.sent-note{display:flex;align-items:flex-start;gap:6px;margin-top:8px!important;color:var(--human);font-size:13.5px;font-weight:600}
.sent-note svg.i{width:16px;height:16px;margin-top:calc((1.5em - 16px) / 2)}
.msg.sys{align-self:center;display:flex;align-items:flex-start;gap:6px;max-width:100%;color:var(--muted);font-size:13px;text-align:center}
.msg.sys svg.i{width:15px;height:15px;margin-top:calc((1.5em - 15px) / 2)}
/* a person's answer looks different from the AI's, and says where it came from */
.msg.human{align-self:flex-start;display:flex;align-items:flex-start;gap:8px;max-width:94%}
.msg.human .bubble{padding:10px 14px;border:1px solid var(--human-line);border-radius:4px 16px 16px 16px;background:var(--human-soft)}
.msg.human .from{margin-bottom:3px;color:var(--human);font-size:12px;font-weight:700}
.suggest{padding:0 20px 10px}
.suggest-h{margin:0 0 6px;color:var(--muted);font-size:12px;font-weight:700}
.q-chips{display:flex;flex-wrap:wrap;gap:6px}
.q-chip{padding:7px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:13.5px;font-weight:600;text-align:left;cursor:pointer;transition:border-color .15s,color .15s,transform .12s}
.q-chip:hover{border-color:var(--brand);color:var(--brand-ink)}
.q-chip:active{transform:scale(.97)}
.ask-form{display:flex;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.ask-form .btn{flex:none;width:44px;padding:0}
/* Nina's People tab: who to ask about what */
.people-body{overflow-y:auto}
.people{flex:1;padding:22px}
.people h1{margin:0;font-size:24px;line-height:1.25;letter-spacing:-.015em}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:18px 0 0;padding:0;list-style:none}
.person{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);animation:rise .35s var(--ease-out) backwards}
.person:nth-child(2){animation-delay:.05s}
.person:nth-child(3){animation-delay:.1s}
.person:nth-child(4){animation-delay:.15s}
.pp-top{display:flex;align-items:center;gap:12px}
.pp-name{margin:0;font-size:15.5px;font-weight:700}
.pp-role{margin:0;color:var(--muted);font-size:13.5px}
.pp-about{flex:1;margin:0;font-size:14px}
.pp-about b{color:var(--muted);font-weight:600}
.pp-tag{display:flex;align-items:flex-start;gap:6px;margin:0;padding:4px 9px;border-radius:7px;background:var(--human-soft);color:var(--human);font-size:12.5px;font-weight:600}
.pp-tag svg.i{width:14px;height:14px;margin-top:calc((1.5em - 14px) / 2)}
/* Omar's Documents: the list on the left, the document on the right */
.lib{display:grid;grid-template-columns:minmax(250px,.85fr) minmax(0,1.25fr)}
.lib-list{min-height:0;overflow-y:auto;padding:22px;border-right:1px solid var(--line)}
.lib-list h1,.answers h1{margin:0;font-size:22px;line-height:1.25;letter-spacing:-.015em}
.lib-docs{display:flex;flex-direction:column;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.lib-doc{display:flex;align-items:flex-start;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,background-color .15s}
.lib-doc:hover{border-color:var(--line-strong)}
.lib-doc[aria-current="true"]{border-color:var(--brand);background:var(--brand-soft)}
.lib-doc>svg.i{width:20px;height:20px;flex:none;color:var(--brand);margin-top:1px}
.lt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.lt b{font-size:14.5px;font-weight:650}
.lu{color:var(--muted);font-size:12.5px}
.flag{display:inline-flex;align-items:flex-start;gap:5px;padding:3px 9px;border-radius:7px;background:var(--well);color:var(--muted);font-size:12px;font-weight:600;line-height:1.4}
.flag svg.i{width:14px;height:14px;flex:none;margin-top:calc((1.4em - 14px) / 2)}
.flag.brand{background:var(--brand-soft);color:var(--brand-ink)}
.flag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.flag.ok{background:var(--human-soft);color:var(--human)}
.lt .flag{margin-top:5px}
.lib-read{min-height:0;overflow-y:auto;padding:22px 26px 28px;background:var(--surface)}
.lib-read .doc-upd{margin-bottom:16px}
.lib-s{border:1px solid var(--line)}
.lib-s.old{border-color:var(--warn-line)}
.lib-s.old>p:first-of-type{color:var(--muted)}
.sec-note{display:flex;align-items:flex-start;gap:6px;margin:10px 0 0!important;font-size:13px!important;font-weight:600}
.sec-note svg.i{width:15px;height:15px;flex:none;margin-top:calc((1.5em - 15px) / 2)}
.sec-note.warn{color:var(--warn-ink)}
.sec-note.ok{color:var(--human)}
.uses{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.uses-h{color:var(--muted);font-size:12px;font-weight:700}
.use{display:inline-flex;align-items:flex-start;gap:5px;padding:3px 9px;border-radius:7px;background:var(--well);color:var(--ink);font-size:12px;font-weight:600;line-height:1.4}
.use svg.i{width:14px;height:14px;flex:none;color:var(--muted);margin-top:calc((1.4em - 14px) / 2)}
/* Omar's Answers: one card per question, newest first */
.ans-body{overflow-y:auto}
.answers{flex:1;max-width:880px;padding:22px}
.ans-list{display:flex;flex-direction:column;gap:12px;margin:18px 0 0;padding:0;list-style:none}
.ans{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);animation:rise .35s var(--ease-out) backwards}
.ans-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.ans-q{margin:0;font-size:15.5px;font-weight:700;line-height:1.35}
.ans-who{margin:0;color:var(--muted);font-size:13px}
.ans-a{margin:0 0 10px;font-size:14px}
.ans-a b{color:var(--brand-ink)}
.ans-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ans-reply{margin:12px 0 0;padding:10px 12px;border:1px solid var(--human-line);border-radius:12px;background:var(--human-soft);font-size:14px}
.ans .keep-why{margin:8px 0 10px;color:var(--muted);font-size:14px}
.ans .keep-done{margin:10px 0 0}
.ans-empty{display:flex;align-items:flex-start;gap:10px;margin:18px 0 0;padding:18px;border:1px dashed var(--line-strong);border-radius:14px;color:var(--muted);font-size:14.5px}
.ans-empty svg.i{width:20px;height:20px;flex:none;margin-top:calc((1.5em - 20px) / 2)}
.avatar.priya{background:#FBE3EF;color:#8E2A5C}
.avatar.it{background:#E6E8EE;color:#3B4152}
.avatar.it svg.i{width:18px;height:18px}
.avatar.it.sm svg.i{width:15px;height:15px}
/* a message to anyone, inside the window */
.modal-layer{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(14,16,32,.42);animation:fade .2s}
.modal{width:min(460px,100%);padding:20px;border-radius:16px;background:var(--surface);box-shadow:0 24px 60px rgba(0,0,0,.3);animation:modalIn .25s var(--ease-out)}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
.modal h2{margin:0 0 8px;font-size:19px}
.modal-to{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--muted);font-size:14px}
.modal textarea{min-height:104px;resize:vertical;line-height:1.5}
.modal-note{margin:8px 0 14px;color:var(--muted);font-size:13px}
.modal-row{display:flex;justify-content:flex-end;gap:8px}
/* switching laptops: whose screen this is, and when */
.switch-layer{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:rgba(10,20,48,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.switch-layer.on{display:grid;animation:fade .25s ease-out}
.switch-layer.out{animation:fadeout .25s ease-in forwards}
.switch-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 34px;border-radius:20px;background:var(--surface);box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center;animation:modalIn .4s var(--ease-pop)}
.sw-name{margin:8px 0 0;font-size:19px;font-weight:700}
.sw-when{margin:0;color:var(--muted);font-size:14px}
.toast{position:absolute;z-index:32;left:50%;bottom:18px;display:flex;align-items:flex-start;gap:10px;max-width:min(440px,calc(100% - 32px));padding:11px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translate(-50%,8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg.i{margin-top:calc((1.5em - 20px) / 2);color:#7FE0B5}
.toast.show svg.i{animation:pop .45s var(--ease-pop) .1s backwards}
/* a person's reply: a notification from the laptop, bottom right as on Windows, not the app's toast */
.notif{position:absolute;z-index:34;right:14px;bottom:14px;width:min(360px,calc(100% - 28px));padding:10px 12px 12px;border:1px solid rgba(16,24,40,.08);border-radius:10px;background:rgba(249,250,252,.97);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 14px 36px rgba(16,24,40,.24);color:var(--ink);opacity:0;visibility:hidden;transform:translateX(28px);transition:opacity .22s,transform .3s var(--ease-out),visibility 0s .3s}
.notif.show{opacity:1;visibility:visible;transform:none;transition:opacity .22s,transform .3s var(--ease-out),visibility 0s}
.nt-top{display:flex;align-items:center;gap:7px;margin:0 0 8px;color:var(--muted);font-size:12px}
.nt-top .mini-logo{display:grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--brand);color:#fff}
.nt-top .mini-logo svg{width:11px;height:11px}
.nt-when{margin-left:auto}
.nt-x{display:grid;place-items:center;width:26px;height:26px;margin:-4px -6px -4px 0;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer}
.nt-x:hover{background:var(--well);color:var(--ink)}
.nt-x svg.i{width:14px;height:14px}
.nt-body{display:flex;align-items:flex-start;gap:10px;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.nt-msg{display:flex;flex-direction:column;gap:1px;min-width:0}
.nt-msg b{font-size:14px}
.nt-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.45}

/* the window narrower than a laptop: the source panel slides over, then everything stacks */
@container app (max-width:1000px){
  .side:not(.open){display:none}
  .side.open{position:absolute;top:0;right:0;bottom:0;z-index:15;width:min(320px,100%);box-shadow:-14px 0 32px rgba(16,24,40,.16)}
  /* with a source open over the board, the header makes room so Publish stays in view */
  .body:has(.side.open) .plan-head{flex-direction:column;padding-right:340px}
  .body:has(.side.open) .ph-end{justify-content:flex-start}
  .who{display:none}
}
@container app (max-width:760px){
  /* the tabs move to their own row */
  .app-head{flex-wrap:wrap;height:auto;gap:0 12px;padding:0 14px}
  .brand{height:52px}
  .nav{order:3;flex:0 0 calc(100% + 28px);height:42px;margin:0 -14px;padding:0 8px;overflow-x:auto;border-top:1px solid var(--line)}
  .nav button{flex:none}
  .lib{display:block;overflow-y:auto}
  .lib-list{overflow:visible;padding:18px 14px;border-right:0;border-bottom:1px solid var(--line)}
  .lib-read{overflow:visible;padding:18px 14px 24px}
  .answers{padding:18px 14px}
  .plan{overflow-y:auto}
  .plan-head{flex-direction:column;padding:16px 14px 12px}
  .ph-end{justify-content:flex-start}
  .body:has(.side.open) .plan-head{padding-right:14px}
  .side.open{width:100%}
  .board{flex:none;grid-auto-flow:row;grid-template-columns:1fr;grid-auto-columns:auto;padding:2px 14px 20px;overflow:visible}
  .day{min-height:0}
  .keep,.keep-mini,.keep-done{margin:0 14px 12px}
  /* one column that scrolls: day 1, then Ask; a document covers both, from the top */
  .nina-body{grid-template-columns:1fr;grid-template-rows:auto auto;overflow-y:auto}
  .week{overflow:visible;padding:18px 14px}
  .doc{grid-row:1 / span 2;border-right:0}
  .ask{grid-column:1;grid-row:2;border-left:0;border-top:1px solid var(--line);min-height:560px}
  .chat{min-height:280px}
  .cf-row{grid-template-columns:1fr}
}

/* ================= Phone: steps bar on top, the app full screen ================= */
@media (max-width:899px){
  body{overflow:hidden}
  .page{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0;gap:0;max-width:none}
  .concept{display:none}
  .stage{flex:1;gap:0;overflow:hidden}
  .g-compact{border:0;border-bottom:1px solid var(--navy-line);border-radius:0;background:var(--navy)}
  .g-who{display:none}
  .g-cols{grid-template-columns:minmax(0,1fr)}
  .g-col{display:contents}
  .g-about{order:1}
  .g-foot{order:2}
  .g-cols.is-done .g-about{order:3}
  .g-full{top:100%;width:auto;right:0;max-height:calc(100dvh - 72px);padding-top:12px;border:0;border-bottom:1px solid var(--navy-line);border-radius:0;background:var(--navy)}
  .guide.open .g-compact{border-radius:0}
  .g-full .g-head{display:flex}
  .g-full .g-about,.g-full .g-cta{display:block}
  .lid{padding:0;border-radius:0;background:none;box-shadow:none}
  .cam,.chin-mark,.deck{display:none}
  .browser{border-radius:0}
  .boot .laptop{animation:none}
  .b-bar{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .ring{animation:none;box-shadow:0 0 0 6px rgba(79,195,247,.35)}
}

function setTheme(next, btn) {

/* Language switch, as in the portfolio: the text on screen types itself in again, top to bottom. Each block

let typing = null;
function typeIn() {

    return el;
  };
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);

    const r = el.getBoundingClientRect();

    const block = blockOf(el);

      byBlock.set(block, g); groups.push(g);

    g.nodes.push(n);

      w.className = 'tw' + (g.head ? ' tw-head' : ''); on.className = 'tw-on'; off.className = 'tw-off'; off.textContent = full;
      w.append(on, off);
      node.parentNode.replaceChild(w, node);
      const part = { w, on, off, full, from: sum, k: 0 };
      sum += full.length;
      return part;
    });
    g.total = sum; g.K = -1;
    g.delay = Math.min(gi * 14, 280);
    g.dur = g.head ? Math.max(180, Math.min(sum * 24, 520)) : Math.max(100, Math.min(sum * 6, 420));
  });
  const t0 = performance.now();
  let raf = 0;
  const restore = g => {
    g.done = true;
    g.parts.forEach(pt => { if (pt.w.parentNode) pt.w.parentNode.replaceChild(document.createTextNode(pt.full), pt.w); });
  };
  const frame = now => {
    let busy = 0;
    groups.forEach(g => {
      if (g.done) return;
      const p = (now - t0 - g.delay) / g.dur;
      if (p >= 1) { restore(g); return; }
      busy++;
      if (p <= 0) return;
      const K = Math.round(g.total * p);
      if (K === g.K) return;
      g.K = K;
      g.parts.forEach(pt => {
        const k = Math.max(0, Math.min(pt.full.length, K - pt.from));
        if (k !== pt.k) { pt.k = k; pt.on.textContent = pt.full.slice(0, k); pt.off.textContent = pt.full.slice(k); }
        // the caret sits on the piece being typed now
        pt.w.classList.toggle('is-typing', K > pt.from && K <= pt.from + pt.full.length);
      });
    });

  };
  const job = { finish() { cancelAnimationFrame(raf); clearTimeout(safety); groups.forEach(g => { if (!g.done) restore(g); }); if (typing === job) typing = null; } };
  // if frames stall (a tab in the background), the text still comes back
  const safety = setTimeout(() => job.finish(), 1500);
  typing = job;
  raf = requestAnimationFrame(frame);
}

    const pr = p.getBoundingClientRect();

/* Omar's Documents: what each document feeds, and where a newer one overrules an older one */
function docUses(doc, sec) {
  const steps = state.steps.filter(s => !s.custom && s.src[0] === doc && (!sec || s.src[1] === sec));
  const qs = [...new Set(ANSWER_SRC.filter(([q, d, x]) => d === doc && (!sec || x === sec) && state.answered[q]).map(([q]) => q))];
  return { steps, qs };
}
function libHTML() {
  const rows = DOC_ORDER.map(id => {
    const u = docUses(id);
    const used = [u.steps.length ? t(u.steps.length === 1 ? 'libStep1' : 'libStepN', { n: u.steps.length }) : '', u.qs.length ? t(u.qs.length === 1 ? 'libAns1' : 'libAnsN', { n: u.qs.length }) : ''].filter(Boolean).join(' · ');
    const flags = id !== 'handbook' ? '' : (state.docAdded ? `<span class="flag ok">${icon('check')}<span>${t('libNew')}</span></span>` : '') + `<span class="flag warn">${icon('alert')}<span>${t('libReplaced')}</span></span>`;
    return `<li><button class="lib-doc" type="button" data-action="lib-open" data-doc="${id}"${id === state.libDoc ? ' aria-current="true"' : ''}>${icon('doc')}<span class="lt"><b>${docTitle(id)}</b><span class="lu">${updatedText(id)}</span><span class="lu">${used ? t('libUsed', { list: used }) : t('libUnused')}</span>${flags}</span></button></li>`;

  return `<div class="body lib">

        <h1 id="lib-title" tabindex="-1">${t('libTitle')}</h1>
        <p class="meta">${t('libSub')}</p>

      ${readerHTML(state.libDoc)}

}
function readerHTML(doc) {

/* Omar's Answers: every question, how Firstweek answered it, and what needed a person */

function ansItemHTML(m) {

  const chips = list => list.map(d => `<button class="src" type="button" data-action="lib-open" data-doc="${d}">${icon('doc')}<span>${docTitle(d)}</span></button>`).join('');
  let answer, tags, extra = '';
  if (m.q === 'q1') { answer = t('a1', { deadline: dateShort(HEALTH_DEADLINE) }); tags = flag('doc', 'brand', t('outDoc')) + chips(['benefits']); }
  else if (m.q === 'q2') { answer = t('a2'); tags = flag('alert', 'warn', t('outConflict')) + chips(['vacation', 'handbook']); }
  else {

    answer = `${t(dog ? 'a3' : 'aUnknown')} ${t('a3b', { manager: MANAGER })}`;
    tags = flag('person', '', t('outNone')) + (sent ? flag('send', 'ok', t('outSent', { name: MANAGER })) : '');
